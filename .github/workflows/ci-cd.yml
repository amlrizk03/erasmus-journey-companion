name: CI-CD (Build, Test, Docker Compose)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - activity-service
          - participation-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & Test (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: mvn -B clean test

      - name: Package (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: mvn -B -DskipTests package

  docker-compose-deploy:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Build + Compose Up
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for services
        run: |
          for i in {1..50}; do
            curl -sSf http://localhost:8081/users >/dev/null 2>&1 && echo "user-service up" && break
            echo "waiting for user-service..." && sleep 2
          done

          for i in {1..50}; do
            curl -sSf http://localhost:8082/activities >/dev/null 2>&1 && echo "activity-service up" && break
            echo "waiting for activity-service..." && sleep 2
          done

      - name: Smoke Test (basic endpoints)
        run: |
          curl -i http://localhost:8081/users
          curl -i http://localhost:8082/activities

      - name: Show logs (always)
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: Compose Down (always)
        if: always()
        run: docker compose down
