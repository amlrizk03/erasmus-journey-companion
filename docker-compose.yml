services:
  user-service:
    build: ./user-service
    ports:
      - "8081:8081"

  activity-service:
    build: ./activity-service
    ports:
      - "8082:8082"

  participation-service:
    build: ./participation-service
    ports:
      - "8083:8083"
    depends_on:
      - user-service
      - activity-service
